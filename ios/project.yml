name: Ethic
options:
  bundleIdPrefix: com.ethic
  deploymentTarget:
    iOS: "17.0"
packages:
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    exactVersion: 2.17.0
targets:
  Ethic:
    type: application
    platform: iOS
    sources: [Ethic]
    dependencies:
      - package: LiveKit
    info:
      path: Ethic/Info.plist
      properties:
        CFBundleDisplayName: Ethic Messenger
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBlack
          UIImageName: Logo
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio, voip]
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Микрофон нужен для звонков и голосовых сообщений.
        NSCameraUsageDescription: Камера нужна для видеозвонков и фото.
        NSPhotoLibraryUsageDescription: Доступ к фото нужен, чтобы отправлять их в чат и ставить аватар.
    settings:
      base:
        PRODUCT_NAME: Ethic
        PRODUCT_BUNDLE_IDENTIFIER: com.ethic.messenger
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: NO
