name: APK для образа Ethic OS
# The clicker exists only in the Ethic OS image. Both APKs are short-lived test artifacts, never put in a release.
on:
  push:
    branches: [next-update]
    paths: ['android/**', '.github/workflows/ethic-os-apks.yml']

jobs:
  apks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
      - name: Build
        working-directory: android
        env:
          VERSION_NAME: 2.7.8-test
        run: |
          VERSION_CODE=${{ github.run_number }} ./gradlew :clicker:assembleRelease --no-daemon
          VERSION_CODE=$(( 150 + ${{ github.run_number }} )) ./gradlew :app:assembleRelease --no-daemon
      - name: Sign
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          sign() {
            "$BT/zipalign" -p -f 4 "$1" aligned.apk
            "$BT/apksigner" sign --ks release.keystore --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
              --key-pass env:ANDROID_KEY_PASSWORD --ks-key-alias "$ANDROID_KEY_ALIAS" --out "$2" aligned.apk
            "$BT/apksigner" verify --print-certs "$2" | head -3
          }
          sign android/clicker/build/outputs/apk/release/clicker-release-unsigned.apk Ethic-Clicker.apk
          sign android/app/build/outputs/apk/release/app-release-unsigned.apk Ethic-Messenger-test.apk
          rm release.keystore aligned.apk
      - uses: actions/upload-artifact@v7
        with:
          name: ethic-os-apks
          path: |
            Ethic-Clicker.apk
            Ethic-Messenger-test.apk
          retention-days: 3
