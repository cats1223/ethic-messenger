name: APK для образа Ethic OS
# The clicker exists only in the Ethic OS image: it is kept as a short-lived artifact, never put in a release.
on:
  push:
    branches: [next-update]
    paths: ['android/**', '.github/workflows/ethic-os-apks.yml']

jobs:
  apks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Build
        working-directory: android
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "VERSION_CODE=$(( 100 + ${{ github.run_number }} + 1000 ))" >> "$GITHUB_ENV"
          echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          chmod +x gradlew
          VERSION_NAME=1.0.${{ github.run_number }} VERSION_CODE=${{ github.run_number }} ./gradlew --no-daemon :clicker:assembleRelease
      - name: Sign
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 android/clicker/build/outputs/apk/release/clicker-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks release.keystore --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --out Ethic-Clicker.apk aligned.apk
          "$BT/apksigner" verify --print-certs Ethic-Clicker.apk | head -3
          rm release.keystore
      - uses: actions/upload-artifact@v7
        with:
          name: ethic-clicker
          path: Ethic-Clicker.apk
          retention-days: 3
