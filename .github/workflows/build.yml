name: Сборка приложений

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия, например 2.0.0'
        required: true
        default: '2.0.0'
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Version
        run: |
          VER="${{ inputs.version }}"; [ -z "$VER" ] && VER="${GITHUB_REF_NAME#v}"
          echo "VERSION_NAME=$VER" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(( 100 + ${{ github.run_number }} ))" >> "$GITHUB_ENV"
      - name: Build
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Sign
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks release.keystore --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --out Ethic-Messenger.apk aligned.apk
          "$BT/apksigner" verify --print-certs Ethic-Messenger.apk | head -3
          rm release.keystore
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Ethic Messenger v${{ env.VERSION_NAME }}
          body: |
            ## Ethic Messenger v${{ env.VERSION_NAME }} — нативное приложение для Android

            Приложение полностью переписано на Kotlin + Jetpack Compose: свой интерфейс без браузера внутри,
            звонки через нативный WebRTC (LiveKit), как настоящие телефонные звонки.

            **Установка:** скачайте `Ethic-Messenger.apk`, откройте файл и разрешите установку из этого источника.
            Ставится поверх старой версии, вход сохраняется.

            **iPhone:** нативная версия в работе, пока используйте `Ethic-Messenger.ipa` из [v1.1.2](../../releases/tag/v1.1.2).
          files: Ethic-Messenger.apk
