name: Сборка приложений

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия, например 2.0.0'
        required: true
        default: '2.0.0'
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Version
        run: |
          VER="${{ inputs.version }}"; [ -z "$VER" ] && VER="${GITHUB_REF_NAME#v}"
          echo "VERSION_NAME=$VER" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(( 100 + ${{ github.run_number }} ))" >> "$GITHUB_ENV"
      - name: Build
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Sign
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks release.keystore --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --out Ethic-Messenger.apk aligned.apk
          "$BT/apksigner" verify --print-certs Ethic-Messenger.apk | head -3
          rm release.keystore
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: Ethic-Messenger.apk

  ios:
    name: iOS (IPA)
    # Xcode 26 / iOS 26 SDK: SwiftUI gets the Liquid Glass system design.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Version, Xcode 26 and XcodeGen
        run: |
          VER="${{ inputs.version }}"; [ -z "$VER" ] && VER="${GITHUB_REF_NAME#v}"
          echo "VERSION_NAME=$VER" >> "$GITHUB_ENV"
          XC=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1); sudo xcode-select -s "$XC"; xcodebuild -version
          curl -sSfL -o xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          unzip -q xcodegen.zip -d xg && echo "$PWD/xg/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Build (unsigned)
        working-directory: ios
        run: |
          xcodegen generate
          xcodebuild -project Ethic.xcodeproj -scheme Ethic -configuration Release -sdk iphoneos             -destination 'generic/platform=iOS' -derivedDataPath build             MARKETING_VERSION="$VERSION_NAME" CURRENT_PROJECT_VERSION="${{ github.run_number }}"             CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Ethic.app Payload/
          zip -qry "$GITHUB_WORKSPACE/Ethic-Messenger.ipa" Payload
      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: Ethic-Messenger.ipa

  windows:
    name: Windows (EXE)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build installer
        working-directory: desktop
        shell: bash
        run: |
          VER="${{ inputs.version }}"; [ -z "$VER" ] && VER="${GITHUB_REF_NAME#v}"
          npm ci --no-audit --no-fund
          npm version "$VER" --no-git-tag-version --allow-same-version
          npx electron-builder --win nsis --publish never
          cp dist/Ethic-Messenger-Setup.exe "$GITHUB_WORKSPACE/"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: Ethic-Messenger-Setup.exe

  release:
    name: Релиз
    needs: [android, ios, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Version
        run: |
          VER="${{ inputs.version }}"; [ -z "$VER" ] && VER="${GITHUB_REF_NAME#v}"
          echo "VERSION_NAME=$VER" >> "$GITHUB_ENV"
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Ethic Messenger v${{ env.VERSION_NAME }}
          body: |
            ## Ethic Messenger v${{ env.VERSION_NAME }}

            Нативные приложения: Android на Kotlin + Jetpack Compose, iPhone на SwiftUI с Liquid Glass (iOS 26).
            Звонки через нативный WebRTC (LiveKit), как настоящие телефонные.

            **Android** — скачайте `Ethic-Messenger.apk`, откройте файл и разрешите установку из этого источника. Ставится поверх старой версии.

            **Windows** — скачайте `Ethic-Messenger-Setup.exe` и запустите: установка в один клик, ярлык на рабочем столе. Приложение живёт в трее, как Discord.

            **iPhone** — скачайте `Ethic-Messenger.ipa` и установите через [Sideloadly](https://sideloadly.io) или [AltStore](https://altstore.io) со своим Apple ID. С бесплатным Apple ID приложение нужно переподписывать раз в 7 дней.
          files: |
            dist/Ethic-Messenger.apk
            dist/Ethic-Messenger.ipa
            dist/Ethic-Messenger-Setup.exe
